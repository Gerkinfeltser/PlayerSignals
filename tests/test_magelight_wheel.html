<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PlayerSignals Magelight browser check</title>
<h1>PlayerSignals Magelight browser check</h1>
<pre id="result">Running…</pre>
<iframe title="Actual wheel" width="960" height="900"></iframe>
<script>
const frame = document.querySelector("iframe");
frame.addEventListener("load", async () => {
    if (!frame.srcdoc) return;
    const report = document.getElementById("result");
    try {
        const view = frame.contentWindow, doc = frame.contentDocument, replies = [];
        view.psWheelChoice = value => replies.push(value);
        const assert = (ok, message) => { if (!ok) throw Error(message); };
        const region = (i, mode = "target") => doc.getElementById(`slot-${i}-${mode}`);
        const click = node => node.dispatchEvent(new view.MouseEvent("click", {bubbles:true}));
        const clickTip = i => {
            const angle = i*Math.PI/6, point = svg.createSVGPoint();
            point.x = 1800+1500*Math.sin(angle); point.y = 1800-1500*Math.cos(angle);
            const screen = point.matrixTransform(svg.getScreenCTM()), actual = doc.elementFromPoint(screen.x,screen.y);
            assert(actual?.closest(".region") === region(i), `Navigation tip ${i} does not route to its merged target`);
            click(actual);
        };
        const keyEvent = (type, key, code = key, location = 0, repeat = false) => {
            const event = new view.KeyboardEvent(type, {key, code, location, repeat, bubbles:true, cancelable:true});
            doc.dispatchEvent(event); return event;
        };
        const key = key => keyEvent("keydown", key);
        const visible = () => view.getComputedStyle(doc.querySelector("main")).visibility === "visible";
        const layout = await (await fetch("../PlayerSignals/SKSE/Plugins/PlayerSignals/layout.json")).json();
        const entry = s => !s ? null : [s.label + (s.submenu ? " >" : s.control === "back" ? " <" : ""), s.action?.name || s.intent || "", s.action ? "action" : s.intent ? "intent" : s.submenu ? "submenu" : s.control === "back" ? "back" : "navigation"];
        const payload = (slots, target = "Lydia", theme = "slate", openKey = 184) => ({theme, target, openKey, slots:Array.from({length:12}, (_, i) => entry(slots[i]))});
        const begin = (token, data) => view.psWheelBegin(token + "|" + JSON.stringify(data));
        const arm = (token, slots, target = "Lydia", theme = "slate", openKey = 184) => {
            begin(token, payload(slots, target, theme, openKey));
            assert(!visible(), "Page appeared before arm");
            view.psWheelArm("stale"); assert(!visible(), "Stale request armed the page");
            view.psWheelArm(token); assert(visible(), "Valid request did not arm");
        };
        doc.documentElement.style.setProperty("--ps-tween", "0ms");
        assert(!visible(), "Page appeared without a request");
        assert(doc.querySelectorAll('g[id^="slot-"][data-index]').length === 12, "Wheel does not have 12 sectors");
        assert(!doc.querySelector("image"), "Wheel retains raster images");
        const vignette = doc.getElementById("vignette"), raf = view.qaRAF;
        assert(vignette && view.getComputedStyle(vignette).visibility === "hidden", "Vignette visible while disarmed");
        // Compare rendered geometry in a common SVG frame, including ancestor transforms.
        const boundsIn = (art, frame) => {
            const box = art.getBBox(), m = frame.getCTM().inverse().multiply(art.getCTM());
            const points = [[box.x,box.y],[box.x+box.width,box.y],[box.x+box.width,box.y+box.height],[box.x,box.y+box.height]].map(([x,y]) => new view.DOMPoint(x,y).matrixTransform(m));
            const x = Math.min(...points.map(p => p.x)), y = Math.min(...points.map(p => p.y));
            return {x, y, width:Math.max(...points.map(p => p.x))-x, height:Math.max(...points.map(p => p.y))-y};
        };
        const separated = (a, b) => [a,b].some(poly => poly.some((p,i) => {
            const q = poly[(i+1)%poly.length], nx = p.y-q.y, ny = q.x-p.x;
            const pa = a.map(v => v.x*nx+v.y*ny), pb = b.map(v => v.x*nx+v.y*ny);
            return Math.max(...pa) <= Math.min(...pb) || Math.max(...pb) <= Math.min(...pa);
        }));
        const source = new view.DOMParser().parseFromString(await (await fetch("../media/src/RadialUI.svg")).text(), "image/svg+xml");
        const fixture = doc.importNode(source.documentElement, true);
        fixture.style.cssText = "position:absolute;left:-10000px;top:0;width:3600px;height:3600px;pointer-events:none";
        doc.body.appendChild(fixture);
        const template = [...fixture.querySelectorAll("g")].find(g => /^Piece\d*$/.test(g.id) && !g.hasAttribute("transform"));
        const sourceBoxes = {};
        for (const [kind,prefix] of [["submenu","Submenu"],["back","Upmenu"]]) {
            sourceBoxes[kind] = boundsIn([...template.children].find(g => g.id.startsWith(prefix)), template);
        }
        fixture.remove();
        const checkArrow = (art, i, kind) => {
            const hit = doc.getElementById(`slot-${i}-target-hit`), edge = region(i).querySelector(".edge-line");
            const box = boundsIn(art, hit), original = sourceBoxes[kind], scale = box.width/original.width;
            assert(Math.abs((box.width/box.height)/(original.width/original.height)-1) <= .01, `Slot ${i} ${kind} arrow aspect ratio distorted`);
            const center = new view.DOMPoint(box.x+box.width/2, box.y+box.height/2);
            const root = center.matrixTransform(svg.getCTM().inverse().multiply(hit.getCTM()));
            const angle = (Math.atan2(root.x-1800,1800-root.y)*180/Math.PI+360)%360;
            assert(Math.abs((angle-i*30+540)%360-180) <= 1, `Slot ${i} ${kind} arrow angle ${angle} is off-center`);
            const edgeLength = edge.getTotalLength(), edgeToHit = hit.getCTM().inverse().multiply(edge.getCTM());
            let innerRadius = Infinity;
            for (let j = 0; j <= 1024; j++) {
                const point = edge.getPointAtLength(edgeLength*j/1024).matrixTransform(edgeToHit), radius = Math.hypot(point.x-1800,point.y-1800);
                innerRadius = Math.min(innerRadius, radius);
            }
            const insetY = 1800 - innerRadius - 4.5, arrowEdge = box.y+box.height;
            assert(arrowEdge <= insetY+.01 && insetY-arrowEdge <= 2, `Slot ${i} ${kind} arrow is not flush with hub inset (${insetY-arrowEdge} SVG units)`);
            const outerY = box.y, centerX = box.x + box.width/2;
            let left = centerX, right = centerX, local;
            for (let n = 0; n < 2000; n++) {
                left -= 1; local = new view.DOMPoint(left, outerY);
                if (!hit.isPointInFill(local)) break;
            }
            for (let n = 0; n < 2000; n++) {
                right += 1; local = new view.DOMPoint(right, outerY);
                if (!hit.isPointInFill(local)) break;
            }
            const ratio = box.width/(right-left), ratioRange = kind === "back" ? [.76,.86] : [.83,.87];
            assert(ratio >= ratioRange[0] && ratio <= ratioRange[1], `Slot ${i} ${kind} arrow fills ${Math.round(100*ratio)}% of outer hit width`);
            const four = [[1,0],[-1,0],[0,1],[0,-1]];
            for (const path of art.querySelectorAll("path")) {
                const length = path.getTotalLength(), pathToHit = hit.getCTM().inverse().multiply(path.getCTM());
                const stroke = view.getComputedStyle(path), halfStroke = stroke.stroke === "none" ? 0 : parseFloat(stroke.strokeWidth)*Math.hypot(pathToHit.a,pathToHit.b)/2;
                for (let j = 0; j <= 128; j++) {
                    const point = path.getPointAtLength(length*j/128).matrixTransform(pathToHit);
                    assert(hit.isPointInFill(point), `Slot ${i} ${kind} arrow path leaves its native merged hit`);
                    for (const [dx,dy] of four)
                        assert(hit.isPointInFill(new view.DOMPoint(point.x+dx*(4+halfStroke),point.y+dy*halfStroke)), `Slot ${i} ${kind} arrow path lacks stroked containment and 4-unit side clearance`);
                }
            }
            const label = doc.querySelector(`.sectorLabel[data-index="${i}"]`), range = doc.createRange();
            range.selectNodeContents(label);
            const l = range.getBoundingClientRect(), m = hit.getScreenCTM().inverse();
            const ink = [[l.left,l.top],[l.right,l.top],[l.right,l.bottom],[l.left,l.bottom]].map(([x,y]) => new view.DOMPoint(x,y).matrixTransform(m));
            const p = 10+8*scale, a = [{x:box.x-p,y:box.y-p},{x:box.x+box.width+p,y:box.y-p},{x:box.x+box.width+p,y:box.y+box.height+p},{x:box.x-p,y:box.y+box.height+p}];
            assert(separated(a,ink), `Slot ${i} ${kind} arrow lacks label clearance`);
            assert(center.y > ink.reduce((sum,p) => sum+p.y,0)/4, `Slot ${i} ${kind} arrow is outside its label`);
        };
        arm("geometry", Array.from({length:12}, (_, i) => ({label:"Slot " + i, intent:"greet"})));
        doc.getElementById("center").focus();
        const svg = doc.getElementById("wheelSvg");
        assert(Math.abs(doc.getElementById("hub-pop").getCTM().a/svg.getCTM().a-1.08)<.001, "Zero-duration hub did not snap to 1.08");
        for (let i = 0; i < 12; i++) for (const [mode, radius] of [["target", 900], ["nearby", 1500]]) {
            const point = svg.createSVGPoint(), angle = i * Math.PI / 6;
            point.x = 1800 + radius * Math.sin(angle); point.y = 1800 - radius * Math.cos(angle);
            const hit = doc.getElementById(`slot-${i}-${mode}-hit`);
            const local = point.matrixTransform(hit.getCTM().inverse().multiply(svg.getCTM()));
            assert(hit.isPointInFill(local), `Slot ${i} ${mode} missed its 30-degree sector`);
            const screen = point.matrixTransform(svg.getScreenCTM());
            assert(doc.elementFromPoint(screen.x, screen.y)?.closest(".region") === region(i, mode), `Slot ${i} ${mode} hit stolen by another region or label`);
            const edge = region(i, mode).querySelector(".edge-line"), length = edge.getTotalLength();
            if (mode === "target")
                assert(hit.getAttribute("d") === hit.getAttribute("data-core-d") && edge.getAttribute("d") === edge.getAttribute("data-core-d") && hit.hasAttribute("data-nav-d") && edge.hasAttribute("data-nav-d"), `Slot ${i} lacks preserved core/navigation path variants`);
            assert(length > 0 && view.getComputedStyle(edge).pointerEvents === "none", "Inset edge missing or intercepts input");
            for (let j = 0; j < 128; j++) {
                const p = edge.getPointAtLength(length * j / 128);
                assert(hit.isPointInFill(p.matrixTransform(hit.getCTM().inverse().multiply(edge.getCTM()))), `Slot ${i} ${mode} inset leaves its shape`);
            }
        }
        const core = region(0), tip = region(0, "nearby");
        core.focus();
        assert(core.classList.contains("hot") && !tip.classList.contains("hot"), "Gesture core wrongly activated Openly tip");
        tip.focus();
        assert(core.classList.contains("hot") && tip.classList.contains("hot"), "Gesture tip failed to highlight both regions");
        const pop = doc.getElementById("slot-0").querySelector(".pop");
        const liftScale = () => pop.parentElement.getCTM().inverse().multiply(pop.getCTM()).a;
        // Fill-only pointer events preserve distinct routing immediately across the shared arc.
        doc.getElementById("center").focus();
        for (let i = 0; i < 12; i++) for (const offset of [-13, -8, 0, 8, 13]) for (const [mode, radius] of [["target",1295.9],["nearby",1296.1]]) {
            const angle = (i*30+offset)*Math.PI/180, point = svg.createSVGPoint();
            point.x = 1800+radius*Math.sin(angle); point.y = 1800-radius*Math.cos(angle);
            const hit = doc.getElementById(`slot-${i}-${mode}-hit`), local = point.matrixTransform(hit.getCTM().inverse().multiply(svg.getCTM()));
            assert(hit.isPointInFill(local), `Slot ${i} ${mode} does not own its side of the shared 1296-unit boundary`);
            const other = doc.getElementById(`slot-${i}-${mode === "target" ? "nearby" : "target"}-hit`);
            const otherLocal = point.matrixTransform(other.getCTM().inverse().multiply(svg.getCTM()));
            assert(!other.isPointInFill(otherLocal), `Slot ${i} core/tip paths overlap inside the shared boundary`);
            const screen = point.matrixTransform(svg.getScreenCTM());
            assert(doc.elementFromPoint(screen.x,screen.y)?.closest(".region") === region(i,mode), `Slot ${i} ${mode} boundary routing overlaps or is stolen`);
        }
        assert(Math.abs(liftScale() - 1) < .001, "Boundary checks require an unlifted wheel");
        core.focus();
        assert(Math.abs(liftScale() - 1.06) < .001, "Hover lift missing");
        region(1).focus();
        assert(Math.abs(liftScale() - 1) < .001, "Previous slice retained lift");
        click(doc.getElementById("center"));
        assert(replies.pop() === "geometry|-1||cancel", "Geometry setup failed to cancel");
        // Navigation and target-only actions each use one merged target, including the former tip.
        for (const [kind, slot, shown, hidden] of [
            ["submenu", {label:"Menu",submenu:"social"}, "submenu-art", "back-art"],
            ["back", {label:"Back",control:"back"}, "back-art", "submenu-art"],
            ["navigation", {label:"Close",control:"close"}, null, null],
            ["action", {label:"Wait here",action:{name:"WaitHere"}}, null, null]
        ]) {
            arm("arrows-" + kind, Array(12).fill(slot));
            doc.getElementById("center").focus();
            for (let i = 0; i < 12; i++) {
                const target = region(i), nearby = region(i, "nearby");
                if (shown) {
                    const art = target.querySelector("." + shown), other = target.querySelector("." + hidden);
                    assert(view.getComputedStyle(art).display !== "none" && view.getComputedStyle(other).display === "none", "Wrong navigation arrow shown");
                    assert(art.getBBox().width > 0 && art.getBBox().height > 0, "Navigation artwork is empty");
                    checkArrow(art, i, kind);
                }
                assert(target.classList.contains(kind === "action" ? "action" : "navigation"), `Slot ${i} ${kind} lacks its merged-kind class`);
                assert(nearby.getAttribute("aria-disabled") === "true" && nearby.getAttribute("tabindex") === "-1" && view.getComputedStyle(nearby).display === "none", `Slot ${i} ${kind} nearby region remains active`);
                const hit = target.querySelector(".hit-area"), edge = target.querySelector(".edge-line");
                assert(hit.getAttribute("d") === hit.getAttribute("data-nav-d") && edge.getAttribute("d") === edge.getAttribute("data-nav-d"), `Slot ${i} ${kind} did not swap to merged hit and edge geometry`);
                assert(target.querySelectorAll(".hit-area").length === 1 && target.querySelectorAll(".edge-line").length === 1, `Slot ${i} ${kind} has multiple hit regions or edges`);
                if (kind === "action")
                    assert([...target.querySelectorAll(".chevron-knot, .broadcast-symbol")].every(art => art.getBoundingClientRect().width === 0), `Action ${i} retains knot/ripple art`);
                const tipPoint = svg.createSVGPoint(), angle = i*Math.PI/6;
                tipPoint.x = 1800 + 1500*Math.sin(angle); tipPoint.y = 1800 - 1500*Math.cos(angle);
                const local = tipPoint.matrixTransform(hit.getCTM().inverse().multiply(svg.getCTM()));
                assert(hit.isPointInFill(local), `Slot ${i} ${kind} merged hit misses its former tip`);
                for (const radius of [1276,1296,1316]) for (const offset of [-8,0,8]) {
                    const a = offset*Math.PI/180, p = new view.DOMPoint(1800+radius*Math.sin(a),1800-radius*Math.cos(a));
                    assert(!edge.isPointInStroke(p), `Slot ${i} ${kind} retains an internal core/tip boundary`);
                }
                const length = edge.getTotalLength();
                for (let n = 0; n < 256; n++)
                    assert(hit.isPointInFill(edge.getPointAtLength(length*n/256)), `Slot ${i} ${kind} merged inset leaves its outline`);
                const nearbyHit = nearby.querySelector(".hit-area");
                click(nearbyHit);
                assert(!replies.length, `Disabled ${kind} nearby region dispatched programmatically`);
            }
            clickTip(11); assert(replies.pop() === `arrows-${kind}|11|${kind === "action" ? "WaitHere|target" : "|navigate"}`, `${kind} former tip failed to dispatch its target-only choice`);
        }
        arm("arrows-hidden", [{label:"Signal",intent:"greet"}, {label:"Action",action:{name:"WaitHere"}}]);
        assert([...doc.querySelectorAll(".navigation-art")].every(art => view.getComputedStyle(art).display === "none"), "Non-navigation entry acquired an arrow");
        key("Escape"); assert(replies.pop() === "arrows-hidden|-1||cancel", "Arrow clearing setup failed to cancel");
        arm("edge-alpha-reference", [{label:"Probe",intent:"greet"}]);
        const enabledEdgeAlpha = Number(view.getComputedStyle(region(0).querySelector(".edge-line")).stroke.match(/rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/)?.[1] ?? 1);
        key("Escape"); assert(replies.pop() === "edge-alpha-reference|-1||cancel", "Edge-alpha reference failed to cancel");
        arm("vignette", []);
        assert(Number(view.getComputedStyle(vignette).opacity) === 1 && view.getComputedStyle(vignette).pointerEvents === "none", "Armed vignette missing or intercepts input");
        assert(Math.abs(vignette.getBoundingClientRect().height - view.innerHeight / 4) < 1 && Math.abs(vignette.getBoundingClientRect().bottom - view.innerHeight) < 1, "Vignette is not bottom quarter");
        assert([...doc.querySelectorAll(".sector")].every(slot => Number(view.getComputedStyle(slot).opacity) === .5), "Empty slots are not half opaque");
        for (let i = 0; i < 12; i++) {
            const target = region(i), nearby = region(i,"nearby"), hit = target.querySelector(".hit-area"), edge = target.querySelector(".edge-line");
            const stroke = view.getComputedStyle(hit), edgeStyle = view.getComputedStyle(edge), alpha = Number(stroke.stroke.match(/rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/)?.[1] ?? 1);
            assert(target.classList.contains("empty") && hit.getAttribute("d") === hit.getAttribute("data-nav-d"), `Empty slot ${i} lacks merged navigation shape`);
            const angle = i*Math.PI/6, tipPoint = svg.createSVGPoint(); tipPoint.x = 1800+1500*Math.sin(angle); tipPoint.y = 1800-1500*Math.cos(angle);
            assert(hit.isPointInFill(tipPoint.matrixTransform(hit.getCTM().inverse().multiply(svg.getCTM()))), `Empty slot ${i} merged shape misses its former tip`);
            assert(stroke.stroke !== "none" && parseFloat(stroke.strokeWidth) > 0 && parseFloat(stroke.strokeWidth) <= 9 && alpha <= .3 && alpha < enabledEdgeAlpha, `Empty slot ${i} outline is not thin and low contrast`);
            assert(edgeStyle.display === "none" || edgeStyle.visibility === "hidden" || edgeStyle.stroke === "none", `Empty slot ${i} retains a visible inset edge`);
            assert([...target.querySelectorAll(".chevron-knot, .broadcast-symbol")].every(art => art.getBoundingClientRect().width === 0), `Empty slot ${i} retains knot/ripple art`);
            assert(view.getComputedStyle(hit).pointerEvents === "none" && nearby.getAttribute("aria-disabled") === "true" && nearby.getAttribute("tabindex") === "-1" && view.getComputedStyle(nearby).display === "none", `Empty slot ${i} remains interactive`);
            click(hit); click(nearby.querySelector(".hit-area"));
            assert(!replies.length, `Empty slot ${i} dispatched programmatically`);
            assert(view.getComputedStyle(hit).fill !== "none", `Empty slot ${i} lost its fill`);
        }
        key("Escape"); assert(replies.pop() === "vignette|-1||cancel", "Vignette setup failed to cancel");
        assert(view.getComputedStyle(vignette).visibility === "hidden", "Vignette outlived armed state");
        // Exercise shipped choices through their actual interactive target.
        for (const [name, slots] of Object.entries(layout.wheels)) {
            if (name !== layout.root) assert(slots[10]?.control === "back", "Shipped submenu Back is not slot 10");
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i]) continue;
                const [, identity, kind] = entry(slots[i]);
                for (const mode of ["target", ...(kind === "intent" ? ["nearby"] : [])]) {
                    const token = `${name}-${i}-${mode}`, route = () => visible() && kind !== "intent" ? clickTip(i) : click(region(i,mode));

                    assert(!replies.length, "Unarmed choice escaped");
                    view.psWheelArm(token);
                    if (kind === "submenu" || kind === "back") {
                        region(i).focus();
                        const art = region(i).querySelector(kind === "submenu" ? ".submenu-art" : ".back-art");
                        checkArrow(art, i, kind);
                    }

                    const destination = ["submenu", "back", "navigation"].includes(kind) ? "navigate" : kind === "action" ? "target" : mode;
                    assert(replies.pop() === `${token}|${i}|${identity}|${destination}`, "Choice lost index, identity or destination");

                    begin(token, payload(slots)); view.psWheelArm(token); route();
                    assert(!replies.length && !visible(), "Completed request submitted again");
                }
            }
        }
        const literal = 'Lydia "雪" \\ <img src=x onerror=alert(1)>';
        const sparse = [null, {label:"Hello <b>friend</b>", intent:"greet"}, null, null, null, null, null, null, null, null, null, {label:"Wait", intent:"wait_here"}];
        arm("literal", sparse, literal);
        assert(doc.getElementById("destination").textContent.includes(literal) && !doc.querySelector("img,b"), "Name/label interpreted as markup");
        assert(doc.getElementById("caption").textContent === sparse[1].label, "Label changed");
        key("ArrowLeft"); assert(doc.activeElement === region(11), "Reverse navigation failed to wrap over holes");
        key("ArrowRight"); assert(doc.activeElement === region(1), "Clockwise navigation failed to wrap over holes");
        key("ArrowDown"); assert(doc.activeElement === region(1,"nearby") && doc.getElementById("destination").textContent === "Openly", "Openly keyboard destination missing");
        key("Enter"); assert(replies.pop() === "literal|1|greet|nearby", "Openly choice was not preserved");
        for (const target of [undefined, ""]) {
            const token = target === undefined ? "absent-target" : "empty-target";
            const slots = [{label:"Action", action:{name:"WaitHere"}}, {label:"Greet", intent:"greet"}];
            const data = payload(slots, target); if (target === undefined) delete data.target;
            begin(token, data); view.psWheelArm(token);

            slate: ["rgb(70, 71, 64)", "rgb(69, 87, 102)", "rgb(94, 61, 56)", "rgb(114, 86, 44)"],
            moss: ["rgb(56, 72, 59)", "rgb(67, 89, 74)", "rgb(90, 68, 54)", "rgb(98, 105, 64)"],
            ember: ["rgb(80, 58, 53)", "rgb(100, 71, 61)", "rgb(110, 58, 51)", "rgb(128, 84, 58)"]
        };
        for (const theme of ["slate", "moss", "ember"]) {
            const sample = [
                {label:"Gesture",intent:"greet"},
                {label:"Action",action:{name:"WaitHere"}},
                {label:"Menu",submenu:"social"},
                {label:"Back",control:"back"}
            ];
            arm("kind-fills-" + theme, sample, "Lydia", theme);
            doc.getElementById("center").focus();

                assert(selected === fills[theme][3], `${theme} selection did not override ${sample[i].label} fill`);
                doc.getElementById("center").focus();

            key("Escape"); assert(replies.pop() === `kind-fills-${theme}|-1||cancel`, "Kind-fill setup failed to cancel");
        }

        const help = doc.getElementById("help"), helpBox = help.getBoundingClientRect(), vignetteBox = vignette.getBoundingClientRect();
        const overlap = {left:Math.max(helpBox.left,vignetteBox.left), right:Math.min(helpBox.right,vignetteBox.right), top:Math.max(helpBox.top,vignetteBox.top), bottom:Math.min(helpBox.bottom,vignetteBox.bottom)};
        assert(overlap.left < overlap.right && overlap.top < overlap.bottom, "Help text does not overlap the vignette paint area");
        assert(view.getComputedStyle(help).position !== "static" && Number(view.getComputedStyle(help).zIndex) > Number(view.getComputedStyle(vignette).zIndex), "Help text is not stacked above the vignette");
