<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PlayerSignals Magelight browser check</title>
<h1>PlayerSignals Magelight browser check</h1>
<pre id="result">Running…</pre>
<iframe title="Actual wheel" width="960" height="900"></iframe>
<script>
const frame = document.querySelector("iframe");
frame.addEventListener("load", async () => {
    if (!frame.srcdoc) return;
    const report = document.getElementById("result");
    try {
        const view = frame.contentWindow, doc = frame.contentDocument, replies = [];
        view.psWheelChoice = value => replies.push(value);
        const assert = (ok, message) => { if (!ok) throw Error(message); };
        const region = (i, mode = "target") => doc.getElementById(`slot-${i}-${mode}`);
        const click = node => node.dispatchEvent(new view.MouseEvent("click", {bubbles:true}));
        const key = key => doc.dispatchEvent(new view.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true}));
        const visible = () => view.getComputedStyle(doc.querySelector("main")).visibility === "visible";
        const layout = await (await fetch("../PlayerSignals/SKSE/Plugins/PlayerSignals/layout.json")).json();
        const entry = s => !s ? null : [s.label + (s.submenu ? " >" : s.control === "back" ? " <" : ""), s.action?.name || s.intent || "", s.action ? "action" : s.intent ? "intent" : s.submenu ? "submenu" : s.control === "back" ? "back" : "navigation"];
        const payload = (slots, target = "Lydia", theme = "slate") => ({theme, target, slots:Array.from({length:12}, (_, i) => entry(slots[i]))});
        const begin = (token, data) => view.psWheelBegin(token + "|" + JSON.stringify(data));
        const arm = (token, slots, target = "Lydia", theme = "slate") => {
            begin(token, payload(slots, target, theme));
            assert(!visible(), "Page appeared before arm");
            view.psWheelArm("stale"); assert(!visible(), "Stale request armed the page");
            view.psWheelArm(token); assert(visible(), "Valid request did not arm");
        };
        doc.documentElement.style.setProperty("--ps-tween", "0ms");
        assert(!visible(), "Page appeared without a request");
        assert(doc.querySelectorAll('g[id^="slot-"][data-index]').length === 12, "Wheel does not have 12 sectors");
        assert(!doc.querySelector("image"), "Wheel retains raster images");
        arm("geometry", Array.from({length:12}, (_, i) => ({label:"Slot " + i, intent:"greet"})));
        doc.getElementById("center").focus();
        const svg = doc.getElementById("wheelSvg");
        for (let i = 0; i < 12; i++) for (const [mode, radius] of [["target", 900], ["nearby", 1500]]) {
            const point = svg.createSVGPoint(), angle = i * Math.PI / 6;
            point.x = 1800 + radius * Math.sin(angle); point.y = 1800 - radius * Math.cos(angle);
            const hit = doc.getElementById(`slot-${i}-${mode}-hit`);
            const local = point.matrixTransform(hit.getCTM().inverse().multiply(svg.getCTM()));
            assert(hit.isPointInFill(local), `Slot ${i} ${mode} missed its 30-degree sector`);
            const screen = point.matrixTransform(svg.getScreenCTM());
            assert(doc.elementFromPoint(screen.x, screen.y)?.closest(".region") === region(i, mode), `Slot ${i} ${mode} hit stolen by another region or label`);
        }
        const core = region(0), tip = region(0, "nearby");
        core.focus();
        assert(core.classList.contains("hot") && !tip.classList.contains("hot"), "Gesture core wrongly activated Openly tip");
        tip.focus();
        assert(core.classList.contains("hot") && tip.classList.contains("hot"), "Gesture tip failed to highlight both regions");
        const pop = doc.getElementById("slot-0").querySelector(".pop");
        assert(Math.abs(new view.DOMMatrix(view.getComputedStyle(pop).transform).a - 1.06) < .001, "Hover lift missing");
        region(1).focus();
        assert(view.getComputedStyle(pop).transform === "none", "Previous slice retained lift");
        click(doc.getElementById("center"));
        assert(replies.pop() === "geometry|-1||cancel", "Geometry setup failed to cancel");
        // Navigation art stays within every core and never intercepts pointer input.
        for (const [kind, slot, shown, hidden] of [
            ["submenu", {label:"Menu",submenu:"social"}, "submenu-art", "back-art"],
            ["back", {label:"Back",control:"back"}, "back-art", "submenu-art"]
        ]) {
            arm("arrows-" + kind, Array(12).fill(slot));
            doc.getElementById("center").focus();
            for (let i = 0; i < 12; i++) {
                const art = region(i).querySelector("." + shown), other = region(i).querySelector("." + hidden);
                assert(view.getComputedStyle(art).display !== "none" && view.getComputedStyle(other).display === "none", "Wrong navigation arrow shown");
                const box = art.getBBox(), hit = doc.getElementById(`slot-${i}-target-hit`);
                assert(box.width > 0 && box.height > 0, "Navigation artwork is empty");
                const matrix = hit.getCTM().inverse().multiply(art.getCTM());
                // Include half the largest authored stroke (15.9 source units).
                for (const x of [box.x - 8, box.x + box.width + 8]) for (const y of [box.y - 8, box.y + box.height + 8]) {
                    const p = svg.createSVGPoint(); p.x = x; p.y = y;
                    assert(hit.isPointInFill(p.matrixTransform(matrix)), `Slot ${i} ${kind} arrow extends outside its core`);
                }
                const center = svg.createSVGPoint(); center.x = box.x + box.width / 2; center.y = box.y + box.height / 2;
                const screen = center.matrixTransform(art.getScreenCTM());
                assert(doc.elementFromPoint(screen.x, screen.y)?.closest(".region") === region(i), "Arrow intercepted its core hit");
            }
            key("Escape"); assert(replies.pop() === `arrows-${kind}|-1||cancel`, "Arrow setup failed to cancel");
        }
        arm("arrows-hidden", [{label:"Signal",intent:"greet"}, {label:"Action",action:{name:"WaitHere"}}]);
        assert([...doc.querySelectorAll(".navigation-art")].every(art => view.getComputedStyle(art).display === "none"), "Non-navigation entry acquired an arrow");
        key("Escape"); assert(replies.pop() === "arrows-hidden|-1||cancel", "Arrow clearing setup failed to cancel");
        // Exercise all shipped positions, destinations and navigation identities.
        for (const [name, slots] of Object.entries(layout.wheels)) {
            if (name !== layout.root) assert(slots[7]?.control === "back", "Shipped submenu Back is not slot 7");
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i]) continue;
                for (const mode of ["target", "nearby"]) {
                    const token = `${name}-${i}-${mode}`;
                    begin(token, payload(slots)); click(region(i, mode));
                    assert(!replies.length, "Unarmed choice escaped");
                    view.psWheelArm(token);
                    click(region(i, mode));
                    const [, identity, kind] = entry(slots[i]);
                    const destination = ["submenu", "back", "navigation"].includes(kind) ? "navigate" : kind === "action" ? "target" : mode;
                    assert(replies.pop() === `${token}|${i}|${identity}|${destination}`, "Choice lost index, identity or destination");
                    click(region(i, mode)); view.psWheelArm(token); click(region(i, mode));
                    begin(token, payload(slots)); view.psWheelArm(token); click(region(i, mode));
                    assert(!replies.length && !visible(), "Completed request submitted again");
                }
            }
        }
        const literal = 'Lydia "雪" \\ <img src=x onerror=alert(1)>';
        const sparse = [null, {label:"Hello <b>friend</b>", intent:"greet"}, null, null, null, null, null, null, null, null, null, {label:"Wait", intent:"wait_here"}];
        arm("literal", sparse, literal);
        assert(doc.getElementById("destination").textContent.includes(literal) && !doc.querySelector("img,b"), "Name/label interpreted as markup");
        assert(doc.getElementById("caption").textContent === sparse[1].label, "Label changed");
        key("ArrowLeft"); assert(doc.activeElement === region(11), "Reverse navigation failed to wrap over holes");
        key("ArrowRight"); assert(doc.activeElement === region(1), "Clockwise navigation failed to wrap over holes");
        key("ArrowDown"); assert(doc.activeElement === region(1,"nearby") && doc.getElementById("destination").textContent === "Openly", "Openly keyboard destination missing");
        key("Enter"); assert(replies.pop() === "literal|1|greet|nearby", "Openly choice was not preserved");
        for (const target of [undefined, ""]) {
            const token = target === undefined ? "absent-target" : "empty-target";
            const slots = [{label:"Action", action:{name:"WaitHere"}}, {label:"Greet", intent:"greet"}];
            const data = payload(slots, target); if (target === undefined) delete data.target;
            begin(token, data); view.psWheelArm(token);
            assert(visible() && region(0).getAttribute("aria-disabled") === "true" && region(0,"nearby").getAttribute("aria-disabled") === "true", "Missing target enabled an action");
            click(region(0)); click(region(0,"nearby")); assert(!replies.length, "Disabled action submitted");
            region(1).focus();
            assert(doc.getElementById("destination").textContent === "No target · Openly", "Missing-target cue incorrect");
            key("Enter"); assert(replies.pop() === `${token}|1|greet|target`, "No-target gesture unavailable (native dispatcher supplies group fallback)");
        }
        for (const theme of ["slate", "moss", "ember"]) {
            arm("theme-" + theme, [{label:"Signal", intent:"greet"}], "Lydia", theme);
            region(0,"nearby").focus();
            assert(doc.documentElement.classList.contains(theme) && doc.getElementById("destination").textContent === "Openly", "Theme changed destination");
            key("Escape"); assert(replies.pop() === `theme-${theme}|-1||cancel`, "Escape failed");
        }
        for (const bad of [payload([],"Lydia","invalid"), {...payload([]), slots:Array(13).fill(null)}, {...payload([]), target:12}]) {
            begin("invalid-" + JSON.stringify(bad), bad); view.psWheelArm("invalid-" + JSON.stringify(bad)); click(region(0));
            assert(!visible() && !replies.length, "Malformed payload enabled a choice");
        }
        for (const mode of ["0", "1"]) {
            arm("host-" + mode, sparse); view.hostMode(mode); key("Enter");
            assert(!visible() && !replies.length, "Host mode edge left stale input active");
        }
        arm("blur", sparse); doc.activeElement.blur(); key("Enter"); assert(!replies.length, "Blurred selection submitted");
        for (const keyName of ["Tab", "Escape"]) {
            arm("cancel-" + keyName, sparse); key(keyName);
            assert(replies.pop() === `cancel-${keyName}|-1||cancel`, "Cancel key failed");
        }
        arm("center", []); click(doc.getElementById("center"));
        assert(replies.pop() === "center|-1||cancel", "Empty-wheel center cancel failed");
        // Exercise real transitions separately from immediate protocol checks.
        doc.documentElement.style.removeProperty("--ps-tween");
        const nextFrame = () => new Promise(resolve => view.requestAnimationFrame(resolve));
        const settle = async () => { await nextFrame(); await nextFrame(); doc.getAnimations().forEach(animation => animation.finish()); };
        arm("motion", [{label:"Signal",intent:"greet"}, {label:"Menu",submenu:"social"}]);
        await settle(); doc.getElementById("center").focus(); await settle();
        core.focus();
        await nextFrame();
        const reduced = view.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduced) {
            const animations = doc.getAnimations();
            assert(animations.some(a => a.transitionProperty === "fill") && animations.some(a => a.transitionProperty.startsWith("stroke")), "Inner fill/outline did not tween");
            const lift = animations.find(a => a.effect.target === pop && a.transitionProperty === "transform");
            assert(lift, "Lift did not tween");
            animations.forEach(a => { a.pause(); a.currentTime = a.effect.getTiming().duration / 2; });
            const scale = new view.DOMMatrix(view.getComputedStyle(pop).transform).a;
            assert(scale > 1 && scale < 1.06, "Lift skipped its eased intermediate state");
            animations.forEach(a => a.finish());
        } else assert(view.getComputedStyle(pop).transitionDuration === "0s", "Reduced motion retained lift animation");
        tip.focus(); await settle();
        assert(Number(view.getComputedStyle(tip.querySelector(".broadcast-symbol")).opacity) === 1, "Tip did not reveal ripple cue");
        const rotating = doc.getElementById("slot-1").getAttribute("transform");
        region(1).focus(); await settle();
        assert(doc.getElementById("slot-1").getAttribute("transform") === rotating, "Hover replaced slot rotation");
        click(region(1));
        if (!reduced) {
            assert(visible() && svg.classList.contains("swap") && !replies.length, "Navigation vanished before outgoing fade");
            const deadline = performance.now() + 2000;
            while (!replies.length && performance.now() < deadline) await nextFrame();
        }
        assert(replies.pop() === "motion|1||navigate" && !visible(), "Navigation fade did not complete exactly one choice");
        arm("incoming", [{label:"Back",control:"back"}]);
        await nextFrame(); await nextFrame();
        if (!reduced) assert(doc.getAnimations().some(a => a.effect.target === svg && a.transitionProperty === "opacity"), "Incoming wheel did not fade");
        await settle();
        key("Escape"); assert(replies.pop() === "incoming|-1||cancel", "Cancel after incoming fade failed");
        report.textContent = "PASS: 12-slot shipped choices and Back placement; both vector arrows fit all 12 cores including stroke clearance, remain type-specific and preserve pointer hits; target/Openly routing; request arming, duplicate/stale protection and host disarm; sparse keyboard wrap; literal name/label safety; missing-target action disabling; theme-independent destinations; malformed payloads; blur and cancellation; eased transitions and reduced motion. Browser-only, not native host/game proof.";
    } catch (error) { report.textContent = "FAIL: " + error.stack; }
});
fetch("../PlayerSignals/Magelight/PlayerSignals/index.html").then(response => response.text()).then(markup => {
    const bridge = '<script>window.modeListeners=[];window.magelight={on:(channel,fn)=>{if(channel==="__uimode")modeListeners.push(fn);},send:()=>{}};window.hostMode=state=>modeListeners.forEach(fn=>fn(state));<\/script>';
    frame.srcdoc = markup.replace(/<html[^>]*>/i, tag => tag + bridge);
}).catch(error => { document.getElementById("result").textContent = "FAIL: " + error.stack; });
</script>
</html>
