<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PlayerSignals Magelight browser check</title>
<h1>PlayerSignals Magelight browser check</h1>
<pre id="result">Running…</pre>
<iframe title="Actual wheel" width="960" height="720"></iframe>
<script>
const frame = document.querySelector("iframe");
frame.addEventListener("load", async () => {
    if (!frame.srcdoc) return;
    const report = document.getElementById("result");
    try {
        const view = frame.contentWindow, doc = frame.contentDocument, replies = [];
        view.psWheelChoice = payload => replies.push(payload);
        const assert = (ok, message) => { if (!ok) throw Error(message); };
        const surface = doc.querySelector("main"), svg = doc.querySelector("#wheelSvg");
        const ids = [...doc.querySelectorAll("[id]")].map(node => node.id);
        assert(new Set(ids).size === ids.length, "Generated document contains duplicate IDs");
        const referencesByNode = new Map();
        for (const node of [svg, ...svg.querySelectorAll("*")]) {
            const references = [];
            for (const attribute of node.attributes) {
                assert(attribute.namespaceURI !== "http://www.serif.com/" && attribute.name !== "xmlns:serif", "Generated art retained editor-only Serif metadata");
                references.push(...[...attribute.value.matchAll(/url\(\s*['"]?#([^'")\s]+)/g)].map(match => match[1]));
                if (attribute.localName === "href" && attribute.value.startsWith("#")) references.push(attribute.value.slice(1));
            }
            if (node.localName === "style") references.push(...[...node.textContent.matchAll(/url\(\s*['"]?#([^'")\s]+)/g)].map(match => match[1]));
            referencesByNode.set(node, references);
            for (const id of references) assert(doc.getElementById(id), "Generated artwork lost reference #" + id);
        }
        const needed = new Set(), pending = [];
        for (const [node, references] of referencesByNode) if (!node.closest("defs") || node.localName === "style") pending.push(...references);
        while (pending.length) {
            const id = pending.pop();
            if (needed.has(id)) continue;
            needed.add(id);
            const definition = doc.getElementById(id);
            for (const node of [definition, ...definition.querySelectorAll("*")]) pending.push(...referencesByNode.get(node));
        }
        for (const definition of svg.querySelectorAll("defs > :not(defs)")) {
            assert(definition.localName === "style" || [definition, ...definition.querySelectorAll("[id]")].some(node => needed.has(node.id)), "Generated art retained an unused definition: " + definition.id);
        }
        assert(!svg.querySelector('rect[id="Artboard1"]'), "Generated art retained the editor Artboard background");
        for (const id of ["centerSplitTop", "centerSplitBottom"]) {
            const split = doc.getElementById(id);
            assert(split && getComputedStyle(split).display === "none" && getComputedStyle(split).pointerEvents === "none" && split.getAttribute("aria-hidden") === "true" && !split.hasAttribute("tabindex"), "Reserved split hub artwork became visible, interactive or focusable");
        }
        const visible = () => getComputedStyle(surface).visibility === "visible";
        const region = (index, mode = "target") => doc.getElementById(`slot-${index}-${mode}`);
        const knotVisible = index => getComputedStyle(region(index, "nearby").querySelector(".chevron-knot")).display !== "none";
        const assertKnots = () => {
            for (let i = 0; i < 8; i++) assert(knotVisible(i), "ChevronKnot disappeared from slot " + i);
        };
        const click = element => element.dispatchEvent(new view.MouseEvent("click", {bubbles:true}));
        const key = key => doc.dispatchEvent(new view.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true}));
        const layout = await (await fetch("../PlayerSignals/SKSE/Plugins/PlayerSignals/layout.json")).json();
        const slotEntry = s => {
            if (!s) return null;
            const kind = s.action ? "action" : s.intent ? "intent" : s.submenu ? "submenu" : s.control === "back" ? "back" : "navigation";
            const identity = s.action?.name || s.intent || "";
            return [s.label + (s.submenu ? " >" : s.control === "back" ? " <" : ""), identity, kind];
        };
        const slotsPayload = (slots, theme = "slate") => JSON.stringify({theme, slots: Array.from({length:8}, (_, i) => slotEntry(slots[i]))});
        const populate = (token, slots, theme) => { view.psWheelBegin(token + "|" + slotsPayload(slots, theme)); assert(!visible(), "Page appeared before arm"); };
        const arm = (token, slots, theme) => { populate(token, slots, theme); view.psWheelArm(token); assert(visible(), "Valid arm failed to reveal page"); };
        // Settle styles synchronously for state assertions; exercise real tweens separately below.
        doc.documentElement.style.setProperty("--ps-tween", "0ms");
        assert(!visible(), "Page appeared before first focus entry");
        arm("geometry", Array.from({length:8}, (_, i) => ({label:"Slot " + i, intent:"greet"})));
        const rootPoint = (angle, radius) => {
            const p = svg.createSVGPoint(); p.x = 1800 + radius * Math.sin(angle); p.y = 1800 - radius * Math.cos(angle); return p;
        };
        for (let i = 0; i < 8; i++) {
            for (const [mode, radius] of [["target", 980], ["nearby", 1450]]) {
                const path = doc.getElementById(`slot-${i}-${mode}-hit`), p = rootPoint(i * Math.PI / 4, radius);
                const local = p.matrixTransform(path.getCTM().inverse().multiply(svg.getCTM()));
                assert(path.isPointInFill(local), `Slot ${i} ${mode} lost its clockwise authored shape`);
                const screen = p.matrixTransform(svg.getScreenCTM());
                assert(doc.elementFromPoint(screen.x, screen.y).closest(".region") === region(i, mode), `Slot ${i} ${mode} hit stolen by art/label/other region`);
            }
        }
        // The chevron's bounding box includes its empty notch: that notch must select the body instead.
        const notch = rootPoint(0, 1290).matrixTransform(svg.getScreenCTM());
        assert(doc.elementFromPoint(notch.x, notch.y).closest(".region") === region(0), "Chevron used a box-shaped hit area");
        key("Escape"); assert(replies.pop() === "geometry|-1||cancel", "Geometry setup cancellation failed");
        for (const [name, slots] of Object.entries(layout.wheels)) {
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i]) continue;
                for (const mode of ["target", "nearby"]) {
                    const token = `${name}-${i}-${mode}`;
                    populate(token, slots); click(region(i, mode)); assert(replies.length === 0, "Pre-arm choice escaped");
                    view.psWheelArm("stale"); assert(!visible(), "Stale request revealed page");
                    view.psWheelArm(token);
                    const entry = slotEntry(slots[i]);
                    assert(getComputedStyle(region(i, "nearby")).display !== "none" && !doc.querySelector(".nearbyLabel"), "Outer hit area disappeared or ALL label returned");
                    click(region(i, mode));
                    assert(replies.pop() === `${token}|${i}|${entry[1]}|${["navigation", "submenu", "back"].includes(entry[2]) ? "navigate" : entry[2] === "action" ? "target" : mode}`, "Slot identity/kind/destination lost");
                    assert(knotVisible(i), `ChevronKnot visibility incorrect for ${entry[2]}`);
                    assert(!visible(), "Selection left old choices visible");
                    click(region(i, mode)); view.psWheelArm(token); click(region(i, mode));
                    view.psWheelBegin(token + "|" + slotsPayload(slots)); view.psWheelArm(token); click(region(i, mode));
                    assert(replies.length === 0, "Duplicate/completed request submitted again");
                }
            }
        }
        const outline = i => region(i, "nearby").firstElementChild;
        const brightness = node => Number(getComputedStyle(node).filter.match(/brightness\(([^)]+)\)/)[1]);
        const hover = node => node.dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        for (const [kind, entry] of [
            ["submenu", {label:"Menu", submenu:"child"}],
            ["back", {label:"Back", control:"back"}],
            ["action", {label:"Act", action:{name:"WaitHere"}}],
            ["intent", {label:"Signal", intent:"greet"}]
        ]) {
            arm("hover-" + kind, [entry, null]);
            const core = region(0), outer = region(0, "nearby"), knot = outer.querySelector(".chevron-knot");
            const idle = () => {
                doc.getElementById("center").focus();
                assert(brightness(core) === 1 && brightness(outer) === 1 && knotVisible(0), kind + " idle brightness/knot changed");
                assert(Number(getComputedStyle(outline(0)).opacity) === (kind === "intent" ? 1 : 0), kind + " idle outline incorrect");
            };
            idle();
            for (const mode of ["target", "nearby"]) for (const input of ["pointer", "focus"]) {
                idle();
                if (input === "pointer") hover(region(0, mode)); else region(0, mode).focus();
                assert(brightness(core) > 1, kind + " " + mode + " " + input + " did not brighten core");
                const outerHot = kind !== "intent" || mode === "nearby";
                assert((brightness(outer) > 1) === outerHot && Number(getComputedStyle(outline(0)).opacity) === 1, kind + " " + mode + " " + input + " outer state incorrect");
                assert(getComputedStyle(knot).display !== "none", kind + " hover hid knot");
            }
            idle();
            hover(region(1)); hover(region(1, "nearby"));
            assert(doc.activeElement === doc.getElementById("center") && getComputedStyle(doc.getElementById("slot-1")).opacity === "0.25" && getComputedStyle(doc.getElementById("slot-1-nearby-hit")).pointerEvents === "none", "Empty slot became active");
        }
        arm("tween", [{label:"Menu", submenu:"child"}]);
        doc.getElementById("center").focus();
        doc.documentElement.style.removeProperty("--ps-tween");
        const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
        await nextFrame(); await nextFrame();
        assert(getComputedStyle(region(0)).transitionDuration === (matchMedia("(prefers-reduced-motion: reduce)").matches ? "0s" : "0.16s"), "Tween duration/reduced motion incorrect");
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
            hover(region(0));
            await new Promise(resolve => setTimeout(resolve, 60));
            const fadingIn = Number(getComputedStyle(outline(0)).opacity);
            assert(fadingIn > 0 && fadingIn < 1 && brightness(region(0)) > 1 && brightness(region(0)) < 1.3, "Hover did not ease brightness and outline in");
            await new Promise(resolve => setTimeout(resolve, 180));
            assert(Number(getComputedStyle(outline(0)).opacity) === 1 && brightness(region(0)) === 1.3, "Hover tween did not finish");
            doc.getElementById("center").focus();
            await new Promise(resolve => setTimeout(resolve, 60));
            const fadingOut = Number(getComputedStyle(outline(0)).opacity);
            assert(fadingOut > 0 && fadingOut < 1, "Outline did not fade out");
            await new Promise(resolve => setTimeout(resolve, 180));
            assert(Number(getComputedStyle(outline(0)).opacity) === 0 && brightness(region(0)) === 1, "Dim tween did not finish");
        }
        doc.documentElement.style.setProperty("--ps-tween", "0ms");
        hover(region(0));
        assert(getComputedStyle(region(0)).transitionDuration === "0s" && getComputedStyle(outline(0)).transitionDuration === "0s", "Tween off switch failed");
        click(region(0));
        assert(replies.pop() === "tween|0||navigate", "Input waited for tween completion");
        const paletteFills = [];
        for (const theme of ["slate", "moss", "ember"]) {
            arm("theme-" + theme, [{label:"Gesture",intent:"greet"}, {label:"Menu",submenu:"child"}], theme);
            assert(doc.documentElement.classList.contains(theme) && ["slate","moss","ember"].filter(name => doc.documentElement.classList.contains(name)).length === 1, "Theme did not replace the previous root class");
            doc.getElementById("center").focus();
            const core = region(0), outer = region(0, "nearby"), util = region(1);
            const hitFill = node => getComputedStyle(node.querySelector(".hit-area")).fill;
            const idleCore = hitFill(core), idleMenu = hitFill(util);
            hover(core);
            const selection = hitFill(core);
            assert(selection !== idleCore && brightness(core) > 1 && brightness(outer) === 1, theme + " signal core hover changed outer or lost selection");
            hover(outer);
            const outerFill = hitFill(outer);
            assert(brightness(core) > 1 && brightness(outer) > 1 && Number(getComputedStyle(outline(0)).opacity) === 1, theme + " signal outer hover failed");
            util.focus();
            assert(hitFill(util) === selection && hitFill(util) !== idleMenu && brightness(util) > 1 && brightness(region(1,"nearby")) > 1, theme + " submenu tint overrode selection/hover");
            doc.getElementById("center").focus();
            assert(Number(getComputedStyle(outline(1)).opacity) === 0 && knotVisible(1), theme + " util idle outline/knot failed");
            region(1,"nearby").focus();
            assert(hitFill(util) === selection && Number(getComputedStyle(outline(1)).opacity) === 1 && brightness(region(1,"nearby")) > 1, theme + " util outer focus failed");
            paletteFills.push([idleCore, idleMenu, selection, outerFill]);
            click(core);
            assert(replies.pop() === `theme-${theme}|0|greet|target`, "Theme changed callback identity");
        }
        for (let field = 0; field < 4; field++) assert(new Set(paletteFills.map(fills => fills[field])).size === 3, "Theme fills are not distinct");
        for (const theme of ["unknown", null, false]) {
            const token = "bad-theme-" + String(theme);
            view.psWheelBegin(token + "|" + slotsPayload([{label:"Gesture",intent:"greet"}], theme));
            view.psWheelArm(token);
            click(region(0));
            assert(replies.length === 0 && region(0).getAttribute("aria-disabled") === "true", "Invalid theme allowed a selection");
            key("Escape");
            assert(replies.pop() === token + "|-1||cancel", "Invalid theme trapped cancellation");
        }
        arm("submenu-shapes", Array.from({length:8}, (_, i) => ({label:"Menu " + i, submenu:"child"})));
        const fill = i => getComputedStyle(doc.getElementById(`slot-${i}-target-hit`)).fill;
        const idleTint = fill(1), selectedTint = fill(0);
        assert(idleTint !== selectedTint, "Submenu tint looks selected");
        region(1).dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(fill(0) === idleTint && fill(1) === selectedTint, "Hover did not replace submenu tint or restore idle tint");
        doc.documentElement.style.setProperty("--submenu-fill", "#334658");
        assert(fill(0) !== idleTint && fill(1) === selectedTint, "Retuning submenu tint changed selection or had no effect");
        doc.documentElement.style.removeProperty("--submenu-fill");
        const checkArt = (kind, other) => {
            for (let i = 0; i < 8; i++) {
                const art = region(i).querySelector("." + kind + "-art");
                assert(getComputedStyle(art).display !== "none" && getComputedStyle(region(i).querySelector("." + other + "-art")).display === "none", "Wrong navigation artwork displayed");
                const box = art.getBBox(), point = svg.createSVGPoint();
                point.x = box.x + box.width / 2; point.y = box.y + box.height / 2;
                const root = point.matrixTransform(svg.getCTM().inverse().multiply(art.getCTM()));
                const dx = root.x - 1800, dy = root.y - 1800, radius = Math.hypot(dx, dy);
                assert(radius > 450 && radius < 800 && (dx * Math.sin(i * Math.PI / 4) - dy * Math.cos(i * Math.PI / 4)) / radius > .99, "Authored navigation art lost its near-hub position or clockwise rotation");
                const screen = point.matrixTransform(art.getScreenCTM());
                assert(doc.elementFromPoint(screen.x, screen.y)?.closest(".region") === region(i), "Navigation art stole its slice's hit area");
            }
        };
        checkArt("submenu", "back");
        key("Escape"); assert(replies.pop() === "submenu-shapes|-1||cancel", "Submenu shape cancellation failed");
        arm("back-shapes", Array.from({length:8}, (_, i) => ({label:"Up " + i, control:"back"})));
        checkArt("back", "submenu");
        assert(fill(1) !== idleTint, "Back acquired submenu tint");
        key("ArrowDown"); key("Enter");
        assert(replies.pop() === "back-shapes|0||navigate", "Back acquired nearby mode or lost navigation callback");
        const markers = [
            {label:"Literal >", intent:"greet"},
            {label:"Menu > inside", submenu:"child"},
            {label:"Keep >", submenu:"child"},
            {label:"Back", control:"back"},
            {label:"Close <", control:"close"},
            {label:"Keep <", control:"back"},
            {label:"Literal <", intent:"greet"},
            {label:"Inside < and trailing < ", control:"back"}
        ];
        arm("submenu-markers", markers);
        for (const [index, label] of [[0,"Literal >"],[1,"Menu > inside"],[2,"Keep >"],[3,"Back"],[4,"Close <"],[5,"Keep <"],[6,"Literal <"],[7,"Inside < and trailing < "]]) {
            region(index).focus();
            assert(doc.querySelector(`.sectorLabel[data-index="${index}"]`).textContent === label && doc.getElementById("caption").textContent === label, "Marker stripping changed authored text or missed the caption");
            assert(region(index).getAttribute("aria-label").startsWith(label + " — "), "Accessible label retained a generated navigation marker or lost authored text");
        }
        assert(fill(0) !== idleTint, "Non-submenu retained submenu tint");
        assert(getComputedStyle(region(0).querySelector(".submenu-art")).display === "none" && getComputedStyle(region(3).querySelector(".back-art")).display !== "none" && getComputedStyle(region(4).querySelector(".back-art")).display === "none", "Intent, Back or Close displayed the wrong navigation artwork");
        assertKnots(markers);
        key("Escape"); assert(replies.pop() === "submenu-markers|-1||cancel", "Marker setup cancellation failed");
        arm("submenu-clear", [null]);
        assert([...doc.querySelectorAll(".navigation-art")].every(art => getComputedStyle(art).display === "none"), "Cleared slots retained navigation artwork");
        assertKnots([null]);
        arm("submenu-before-bad", [{label:"Child",submenu:"child"}]);
        assert(knotVisible(0), "Submenu lost ChevronKnot");
        view.psWheelBegin("submenu-bad|[null]");
        assert(!visible() && [...doc.querySelectorAll(".navigation-art")].every(art => getComputedStyle(art).display === "none"), "Invalid payload retained an armed page or navigation artwork");
        arm("navigation-to-intent", [{label:"Child",submenu:"child"}]);
        assertKnots([{label:"Child",submenu:"child"}]);
        arm("intent-after-navigation", [{label:"Gesture",intent:"greet"}]);
        assertKnots([{label:"Gesture",intent:"greet"}]);
        arm("navigation-to-empty", [{label:"Child",submenu:"child"}]);
        arm("empty-after-navigation", [null]);
        assertKnots([null]);
        arm("root-calm-down", layout.wheels[layout.root]);
        const calmDownIndex = layout.wheels[layout.root].findIndex(slot => slot?.intent === "calm_down");
        assert(calmDownIndex >= 0 && knotVisible(calmDownIndex), "Root Calm down gesture missing or lost ChevronKnot");
        for (const mode of ["target", "nearby"]) {
            const token = "root-calm-down-" + mode;
            arm(token, layout.wheels[layout.root]); click(region(calmDownIndex, mode));
            assert(replies.pop() === `${token}|${calmDownIndex}|calm_down|${mode}`, "Calm down root callback lost its intent or destination");
        }
        arm("root-calm-cancel", layout.wheels[layout.root]);
        for (let i = 0; i < 8; i++) assert(getComputedStyle(region(i, "nearby")).display !== "none", "Chevron disappeared");
        key("Escape"); assert(replies.pop() === "root-calm-cancel|-1||cancel", "Root cancellation failed");
        for (const mode of ["target", "nearby"]) {
            arm("custom-close-" + mode, [{label:"Custom exit", control:"close"}]);
            assert(knotVisible(0), "Custom Close lost ChevronKnot");
            click(region(0, mode)); assert(replies.pop() === `custom-close-${mode}|0||navigate`, "Custom Close lost navigation semantics");
        }
        const literal = '<img src=x onerror="throw Error()"> | "quoted" \\ Ω 😀\nnext\tline and extra descriptive words to wrap across the hub';
        const sparse = [null, {label:literal, intent:"greet"}, null, null, {label:"Second", intent:"deny"}];
        arm("literal", sparse);
        assert(region(0).getAttribute("aria-disabled") === "true" && region(1).getAttribute("aria-disabled") === "false" && region(2).getAttribute("aria-disabled") === "true", "Empty slots compacted/enabled");
        assert(doc.querySelector('.sectorLabel[data-index="1"]').textContent === literal && !doc.querySelector("img"), "Authored label interpreted as markup or altered");
        assert(doc.activeElement === region(1) && doc.getElementById("caption").textContent === literal, "Full label/fresh focus lost");
        for (const text of [doc.querySelector('.sectorLabel[data-index="1"]'), doc.querySelector(".hubContent")]) {
            assert(text.scrollWidth <= text.clientWidth && text.scrollHeight <= text.clientHeight, "Full authored label overflowed its sector or hub");
        }
        key("ArrowRight"); assert(doc.activeElement === region(4), "Clockwise arrows failed to skip holes");
        key("ArrowLeft"); assert(doc.activeElement === region(1), "Reverse arrows failed to skip holes");
        key("ArrowDown"); assert(doc.activeElement === region(1, "nearby"), "Nearby keyboard focus failed");
        key("ArrowUp"); assert(doc.activeElement === region(1), "Target keyboard focus failed");
        key("ArrowDown"); key("Enter"); assert(replies.pop() === "literal|1|greet|nearby", "Nearby keyboard selection lost mode");
        arm("target-key", sparse); key("Enter"); assert(replies.pop() === "target-key|1|greet|target", "Target keyboard selection lost mode");
        const navigation = [null, {label:"Open", submenu:"child"}];
        arm("navigate", navigation);
        assert(getComputedStyle(region(1, "nearby")).display !== "none" && knotVisible(1), "Navigation outer hit area or knot disappeared");
        region(1, "nearby").dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(region(1).classList.contains("hot") && region(1, "nearby").classList.contains("hot") && getComputedStyle(doc.getElementById("slot-1-target-hit")).fill === getComputedStyle(doc.getElementById("slot-1-nearby-hit")).fill && doc.getElementById("destination").textContent === "Navigation", "Navigation chevron did not share inner highlight/destination");
        key("Enter"); assert(replies.pop() === "navigate|1||navigate", "Navigation chevron keyboard selection acquired group mode");
        const action = [null, {label:"Drink", action:{name:"drink_alcohol", args:{drinkName:""}}, event:"both", intent:"offer"}];
        arm("action-hover", action);
        region(1).dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(doc.activeElement === region(1) && doc.getElementById("destination").textContent.includes("Target NPC"), "Action hover did not focus target destination");
        assert(doc.querySelectorAll(".actionLabel")[1].textContent === "ACTION" && getComputedStyle(region(1, "nearby")).display !== "none" && !doc.querySelector(".nearbyLabel"), "Action chevron disappeared, gained ALL, or lacked ACTION badge");
        assert(knotVisible(1), "Action lost ChevronKnot");
        const actionPoint = rootPoint(Math.PI / 4, 980).matrixTransform(svg.getScreenCTM());
        assert(doc.elementFromPoint(actionPoint.x, actionPoint.y).closest(".region") === region(1), "Action target hit area no longer selects the target region");
        region(1, "nearby").dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(region(1).classList.contains("hot") && region(1, "nearby").classList.contains("hot") && doc.getElementById("destination").textContent.includes("Target NPC") && !region(1, "nearby").getAttribute("aria-label").includes("Everyone nearby"), "Action chevron offered a nearby destination");
        click(region(1, "nearby")); assert(replies.pop() === "action-hover|1|drink_alcohol|target", "Action chevron lost target identity or mode");
        arm("action-key", action);
        key("ArrowDown"); assert(doc.activeElement === region(1), "ArrowDown moved an action away from target");
        key("Enter"); assert(replies.pop() === "action-key|1|drink_alcohol|target", "Action keyboard callback lost target identity or mode");
        for (const token of ["empty", "empty-again"]) {
            arm(token, []); assert(doc.activeElement === doc.getElementById("center") && doc.getElementById("caption").textContent === "Cancel", "Empty wheel lacks cancel focus/feedback");
            for (let i = 0; i < 8; i++) {
                assert(getComputedStyle(region(i, "nearby")).display !== "none" && region(i, "nearby").getAttribute("aria-disabled") === "true" && knotVisible(i), "Empty chevron hidden, enabled or missing ChevronKnot");
                click(region(i, "nearby"));
            }
            assert(replies.length === 0, "Disabled chevron submitted a choice");
            click(doc.getElementById("center")); assert(replies.pop() === token + "|-1||cancel", "Center cancellation failed");
        }
        view.psWheelBegin("bad|[null]"); view.psWheelArm("bad"); click(region(0)); assert(replies.length === 0, "Malformed batch allowed selection");
        key("Escape"); assert(replies.pop() === "bad|-1||cancel", "Malformed batch trapped cancellation");
        arm("blur", sparse); doc.activeElement.blur(); key("Enter"); assert(replies.length === 0, "Blurred old focus submitted");
        for (const mode of ["0", "1"]) {
            arm("forced-" + mode, sparse); view.hostMode(mode); key("Enter");
            assert(!visible() && replies.length === 0, "Native mode edge retained an armed page");
        }
        arm("reopen", sparse); key("Enter"); assert(replies.pop() === "reopen|1|greet|target", "Fresh choice failed after native closure");
        for (const k of ["Tab", "Escape"]) for (const name of [layout.root, "social"]) {
            const token = k + "-" + name; arm(token, layout.wheels[name]); key(k);
            assert(replies.pop() === token + "|-1||cancel", k + " failed to cancel " + name);
