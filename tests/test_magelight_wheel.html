<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PlayerSignals Magelight browser check</title>
<h1>PlayerSignals Magelight browser check</h1>
<pre id="result">Running…</pre>
<iframe title="Actual wheel" width="960" height="720"></iframe>
<script>
const frame = document.querySelector("iframe");
frame.addEventListener("load", async () => {
    if (!frame.srcdoc) return;
    const report = document.getElementById("result");
    try {
        const view = frame.contentWindow, doc = frame.contentDocument, replies = [];
        view.psWheelChoice = payload => replies.push(payload);
        const assert = (ok, message) => { if (!ok) throw Error(message); };
        const surface = doc.querySelector("main"), svg = doc.querySelector("#wheelSvg");
        const ids = [...doc.querySelectorAll("[id]")].map(node => node.id);
        assert(new Set(ids).size === ids.length, "Generated document contains duplicate IDs");
        for (const node of svg.querySelectorAll("*")) for (const attribute of node.attributes) {
            const references = [...attribute.value.matchAll(/url\(\s*['"]?#([^'")\s]+)/g)].map(match => match[1]);
            if (attribute.localName === "href" && attribute.value.startsWith("#")) references.push(attribute.value.slice(1));
            for (const id of references) assert(doc.getElementById(id), "Generated artwork lost reference #" + id);
        }
        const visible = () => getComputedStyle(surface).visibility === "visible";
        const region = (index, mode = "target") => doc.getElementById(`slot-${index}-${mode}`);
        const click = element => element.dispatchEvent(new view.MouseEvent("click", {bubbles:true}));
        const key = key => doc.dispatchEvent(new view.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true}));
        const layout = await (await fetch("../PlayerSignals/SKSE/Plugins/PlayerSignals/layout.json")).json();
        const slotEntry = s => {
            if (!s) return null;
            const kind = s.action ? "action" : s.intent ? "intent" : s.submenu ? "submenu" : s.control === "back" ? "back" : "navigation";
            const identity = s.action?.name || s.intent || "";
            return [s.label + (s.submenu ? " >" : s.control === "back" ? " <" : ""), identity, kind];
        };
        const slotsPayload = slots => JSON.stringify(Array.from({length:8}, (_, i) => slotEntry(slots[i])));
        const populate = (token, slots) => { view.psWheelBegin(token + "|" + slotsPayload(slots)); assert(!visible(), "Page appeared before arm"); };
        const arm = (token, slots) => { populate(token, slots); view.psWheelArm(token); assert(visible(), "Valid arm failed to reveal page"); };
        assert(!visible(), "Page appeared before first focus entry");
        arm("geometry", Array.from({length:8}, (_, i) => ({label:"Slot " + i, intent:"greet"})));
        const rootPoint = (angle, radius) => {
            const p = svg.createSVGPoint(); p.x = 1800 + radius * Math.sin(angle); p.y = 1800 - radius * Math.cos(angle); return p;
        };
        for (let i = 0; i < 8; i++) {
            for (const [mode, radius] of [["target", 980], ["nearby", 1450]]) {
                const path = doc.getElementById(`slot-${i}-${mode}-hit`), p = rootPoint(i * Math.PI / 4, radius);
                const local = p.matrixTransform(path.getCTM().inverse().multiply(svg.getCTM()));
                assert(path.isPointInFill(local), `Slot ${i} ${mode} lost its clockwise authored shape`);
                const screen = p.matrixTransform(svg.getScreenCTM());
                assert(doc.elementFromPoint(screen.x, screen.y).closest(".region") === region(i, mode), `Slot ${i} ${mode} hit stolen by art/label/other region`);
            }
        }
        // The chevron's bounding box includes its empty notch: that notch must select the body instead.
        const notch = rootPoint(0, 1290).matrixTransform(svg.getScreenCTM());
        assert(doc.elementFromPoint(notch.x, notch.y).closest(".region") === region(0), "Chevron used a box-shaped hit area");
        key("Escape"); assert(replies.pop() === "geometry|-1||cancel", "Geometry setup cancellation failed");
        for (const [name, slots] of Object.entries(layout.wheels)) {
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i]) continue;
                for (const mode of !slots[i].action && slots[i].intent ? ["target", "nearby"] : ["target"]) {
                    const token = `${name}-${i}-${mode}`;
                    populate(token, slots); click(region(i, mode)); assert(replies.length === 0, "Pre-arm choice escaped");
                    view.psWheelArm("stale"); assert(!visible(), "Stale request revealed page");
                    view.psWheelArm(token); click(region(i, mode));
                    const entry = slotEntry(slots[i]);
                    assert(replies.pop() === `${token}|${i}|${entry[1]}|${["navigation", "submenu", "back"].includes(entry[2]) ? "navigate" : mode}`, "Slot identity/kind/destination lost");
                    assert(!visible(), "Selection left old choices visible");
                    click(region(i, mode)); view.psWheelArm(token); click(region(i, mode));
                    view.psWheelBegin(token + "|" + slotsPayload(slots)); view.psWheelArm(token); click(region(i, mode));
                    assert(replies.length === 0, "Duplicate/completed request submitted again");
                }
            }
        }
        arm("submenu-shapes", Array.from({length:8}, (_, i) => ({label:"Menu " + i, submenu:"child"})));
        const fill = i => getComputedStyle(doc.getElementById(`slot-${i}-target-hit`)).fill;
        const idleTint = fill(1), selectedTint = fill(0);
        assert(idleTint !== selectedTint, "Submenu tint looks selected");
        region(1).dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(fill(0) === idleTint && fill(1) === selectedTint, "Hover did not replace submenu tint or restore idle tint");
        doc.documentElement.style.setProperty("--submenu-fill", "#334658");
        assert(fill(0) !== idleTint && fill(1) === selectedTint, "Retuning submenu tint changed selection or had no effect");
        doc.documentElement.style.removeProperty("--submenu-fill");
        const checkArt = (kind, other) => {
            for (let i = 0; i < 8; i++) {
                const art = region(i).querySelector("." + kind + "-art");
                assert(getComputedStyle(art).display !== "none" && getComputedStyle(region(i).querySelector("." + other + "-art")).display === "none", "Wrong navigation artwork displayed");
                const box = art.getBBox(), point = svg.createSVGPoint();
                point.x = box.x + box.width / 2; point.y = box.y + box.height / 2;
                const root = point.matrixTransform(svg.getCTM().inverse().multiply(art.getCTM()));
                const dx = root.x - 1800, dy = root.y - 1800, radius = Math.hypot(dx, dy);
                assert(radius > 450 && radius < 800 && (dx * Math.sin(i * Math.PI / 4) - dy * Math.cos(i * Math.PI / 4)) / radius > .99, "Authored navigation art lost its near-hub position or clockwise rotation");
                const screen = point.matrixTransform(art.getScreenCTM());
                assert(doc.elementFromPoint(screen.x, screen.y)?.closest(".region") === region(i), "Navigation art stole its slice's hit area");
                const path = doc.getElementById(`slot-${i}-target-hit`);
                point.x = 320; point.y = 1800;
                const restoredTip = point.matrixTransform(path.getScreenCTM());
                assert(doc.elementFromPoint(restoredTip.x, restoredTip.y)?.closest(".region") === region(i), "Removed runtime notch still clips the slice tip");
            }
        };
        checkArt("submenu", "back");
        key("Escape"); assert(replies.pop() === "submenu-shapes|-1||cancel", "Submenu shape cancellation failed");
        arm("back-shapes", Array.from({length:8}, (_, i) => ({label:"Up " + i, control:"back"})));
        checkArt("back", "submenu");
        assert(fill(1) !== idleTint, "Back acquired submenu tint");
        key("ArrowDown"); key("Enter");
        assert(replies.pop() === "back-shapes|0||navigate", "Back acquired nearby mode or lost navigation callback");
        const markers = [
            {label:"Literal >", intent:"greet"},
            {label:"Menu > inside", submenu:"child"},
            {label:"Keep >", submenu:"child"},
            {label:"Back", control:"back"},
            {label:"Close <", control:"close"},
            {label:"Keep <", control:"back"},
            {label:"Literal <", intent:"greet"},
            {label:"Inside < and trailing < ", control:"back"}
        ];
        arm("submenu-markers", markers);
        for (const [index, label] of [[0,"Literal >"],[1,"Menu > inside"],[2,"Keep >"],[3,"Back"],[4,"Close <"],[5,"Keep <"],[6,"Literal <"],[7,"Inside < and trailing < "]]) {
            region(index).focus();
            assert(doc.querySelector(`.sectorLabel[data-index="${index}"]`).textContent === label && doc.getElementById("caption").textContent === label, "Marker stripping changed authored text or missed the caption");
            assert(region(index).getAttribute("aria-label").startsWith(label + " — "), "Accessible label retained a generated navigation marker or lost authored text");
        }
        assert(fill(0) !== idleTint, "Non-submenu retained submenu tint");
        assert(getComputedStyle(region(0).querySelector(".submenu-art")).display === "none" && getComputedStyle(region(3).querySelector(".back-art")).display !== "none" && getComputedStyle(region(4).querySelector(".back-art")).display === "none", "Intent, Back or Close displayed the wrong navigation artwork");
        key("Escape"); assert(replies.pop() === "submenu-markers|-1||cancel", "Marker setup cancellation failed");
        arm("submenu-clear", [null]);
        assert([...doc.querySelectorAll(".navigation-art")].every(art => getComputedStyle(art).display === "none"), "Cleared slots retained navigation artwork");
        arm("submenu-before-bad", [{label:"Child",submenu:"child"}]);
        view.psWheelBegin("submenu-bad|[null]");
        assert(!visible() && [...doc.querySelectorAll(".navigation-art")].every(art => getComputedStyle(art).display === "none"), "Invalid payload retained navigation artwork");
        arm("root-close", layout.wheels[layout.root]);
        const closeIndex = layout.wheels[layout.root].findIndex(slot => slot?.control === "close");
        assert(closeIndex === 7 && doc.querySelector('.sectorLabel[data-index="7"]').textContent === "Close", "Shipped root Close changed");
        click(region(closeIndex)); assert(replies.pop() === "root-close|7||navigate", "Root Close callback changed");
        const literal = '<img src=x onerror="throw Error()"> | "quoted" \\ Ω 😀\nnext\tline and extra descriptive words to wrap across the hub';
        const sparse = [null, {label:literal, intent:"greet"}, null, null, {label:"Second", intent:"deny"}];
        arm("literal", sparse);
        assert(region(0).getAttribute("aria-disabled") === "true" && region(1).getAttribute("aria-disabled") === "false" && region(2).getAttribute("aria-disabled") === "true", "Empty slots compacted/enabled");
        assert(doc.querySelector('.sectorLabel[data-index="1"]').textContent === literal && !doc.querySelector("img"), "Authored label interpreted as markup or altered");
        assert(doc.activeElement === region(1) && doc.getElementById("caption").textContent === literal, "Full label/fresh focus lost");
        for (const text of [doc.querySelector('.sectorLabel[data-index="1"]'), doc.querySelector(".hubContent")]) {
            assert(text.scrollWidth <= text.clientWidth && text.scrollHeight <= text.clientHeight, "Full authored label overflowed its sector or hub");
        }
        key("ArrowRight"); assert(doc.activeElement === region(4), "Clockwise arrows failed to skip holes");
        key("ArrowLeft"); assert(doc.activeElement === region(1), "Reverse arrows failed to skip holes");
        key("ArrowDown"); assert(doc.activeElement === region(1, "nearby"), "Nearby keyboard focus failed");
        key("ArrowUp"); assert(doc.activeElement === region(1), "Target keyboard focus failed");
        key("ArrowDown"); key("Enter"); assert(replies.pop() === "literal|1|greet|nearby", "Nearby keyboard selection lost mode");
        arm("target-key", sparse); key("Enter"); assert(replies.pop() === "target-key|1|greet|target", "Target keyboard selection lost mode");
        const navigation = [null, {label:"Open", submenu:"child"}];
        arm("navigate", navigation);
        assert(getComputedStyle(region(1, "nearby")).display === "none", "Navigation exposed group chevron");
        click(region(1, "nearby")); assert(replies.length === 0, "Navigation accepted nearby action");
        key("ArrowDown"); key("Enter"); assert(replies.pop() === "navigate|1||navigate", "Navigation acquired or retained group mode");
        const action = [null, {label:"Drink", action:{name:"drink_alcohol", args:{drinkName:""}}, event:"both", intent:"offer"}];
        arm("action-hover", action);
        region(1).dispatchEvent(new view.MouseEvent("mouseenter", {bubbles:false}));
        assert(doc.activeElement === region(1) && doc.getElementById("destination").textContent.includes("Target NPC"), "Action hover did not focus target destination");
        assert(doc.querySelector(".actionLabel").textContent === "ACTION" && getComputedStyle(region(1, "nearby")).display === "none" && doc.querySelector(".nearbyLabel").style.display === "none", "Action exposed nearby chevron or lacked ACTION badge");
        const actionPoint = rootPoint(Math.PI / 4, 980).matrixTransform(svg.getScreenCTM());
        assert(doc.elementFromPoint(actionPoint.x, actionPoint.y).closest(".region") === region(1), "Action target hit area no longer selects the target region");
        click(region(1, "nearby")); assert(replies.length === 0, "Action accepted nearby click");
        key("ArrowDown"); assert(doc.activeElement === region(1), "ArrowDown moved an action away from target");
        key("Enter"); assert(replies.pop() === "action-hover|1|drink_alcohol|target", "Action callback lost target identity or mode");
        for (const token of ["empty", "empty-again"]) {
            arm(token, []); assert(doc.activeElement === doc.getElementById("center") && doc.getElementById("caption").textContent === "Cancel", "Empty wheel lacks cancel focus/feedback");
            click(doc.getElementById("center")); assert(replies.pop() === token + "|-1||cancel", "Center cancellation failed");
        }
        view.psWheelBegin("bad|[null]"); view.psWheelArm("bad"); click(region(0)); assert(replies.length === 0, "Malformed batch allowed selection");
        key("Escape"); assert(replies.pop() === "bad|-1||cancel", "Malformed batch trapped cancellation");
        arm("blur", sparse); doc.activeElement.blur(); key("Enter"); assert(replies.length === 0, "Blurred old focus submitted");
        for (const mode of ["0", "1"]) {
            arm("forced-" + mode, sparse); view.hostMode(mode); key("Enter");
            assert(!visible() && replies.length === 0, "Native mode edge retained an armed page");
        }
        arm("reopen", sparse); key("Enter"); assert(replies.pop() === "reopen|1|greet|target", "Fresh choice failed after native closure");
        for (const k of ["Tab", "Escape"]) for (const name of [layout.root, "social"]) {
            const token = k + "-" + name; arm(token, layout.wheels[name]); key(k);
            assert(replies.pop() === token + "|-1||cancel", k + " failed to cancel " + name);
        }
        report.textContent = "PASS: authored submenu and Back artwork position/rotation and pointer-safe hit testing in all eight slices; restored slice tips; retunable idle tint distinct from hover selection; marker-free submenu and Back labels/caption/accessibility with exactly one typed suffix removed and authored markers preserved; cleared/invalid style reset; unchanged root Close; authored clockwise gesture geometry and non-box hit areas; all shipped target/nearby/navigation choices; action target-only behavior; pre-arm/stale/duplicate guards; literal Unicode labels; holes; keyboard destinations; center/Tab/Escape cancellation; native-mode disarm and reopening. Browser-only; no native Papyrus/game proof.";
    } catch (error) { report.textContent = "FAIL: " + error.stack; throw error; }
});
// Model only the host boundary installed before page script execution; render the actual generated page unchanged otherwise.
fetch("../PlayerSignals/Magelight/PlayerSignals/index.html").then(response => response.text()).then(markup => {
    const bridge = '<script>window.modeListeners=[];window.magelight={on:(channel,fn)=>{if(channel==="__uimode")modeListeners.push(fn);},send:()=>{}};window.hostMode=state=>modeListeners.forEach(fn=>fn(state));<\/script>';
    frame.srcdoc = markup.replace(/<html[^>]*>/i, tag => tag + bridge);
}).catch(error => { document.getElementById("result").textContent = "FAIL: " + error.stack; });
</script>
</html>
