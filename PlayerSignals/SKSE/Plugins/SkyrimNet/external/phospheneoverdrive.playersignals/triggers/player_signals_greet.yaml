name: player_signals_greet
description: PlayerSignals - Greet
eventCriteria:
  - eventType: mod_event
    schemaConditions:
      - fieldPath: event_name
        operator: equals
        value: PlayerSignals_Intent_greet
      - fieldPath: sender_form_id
        operator: equals
        value: "00000014"
response:
  type: direct_narration
  content: "{{ originator }} gives a friendly wave in greeting."
audience: nearby_npcs
enabled: true
probability: 1.0
cooldownSeconds: 0
priority: 5
