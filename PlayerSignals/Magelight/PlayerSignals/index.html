<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerSignals</title>
<style>
    :root { --ps-tween: 160ms; color-scheme: dark; font: 18px Georgia, serif; color: #fff3d9; --selection-band: #a8873f; --cap-lit-fill: #fff4d0; --cap-lit-band: #d9bd79; --flow-opacity: .12; --flow-lit-opacity: .35; --flow-lit-signal-opacity: .12; --flow-signal-tint: #7fe6d4; --flow-lit-signal-tint: #fff1b8; --flow-lit-tint: #fff6e0; }
    :root, :root.slate { --nav-fill: #464740; --gesture-fill: #455766; --action-fill: #5e3d38; --selection-fill: var(--selection-outline); --selection-outline: #ffdc8c; --hover-fill: #e9bd6c; }
    :root.moss { --nav-fill: #38483b; --gesture-fill: #43594a; --action-fill: #5a4436; --selection-fill: var(--selection-outline); --selection-outline: #ffdc8c; --hover-fill: #b8c58a; }
    :root.ember { --nav-fill: #503a35; --gesture-fill: #64473d; --action-fill: #6e3a33; --selection-fill: var(--selection-outline); --selection-outline: #ffdc8c; --hover-fill: #dca27d; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: transparent; }
    main { width: min(96vw, 800px); text-align: center; visibility: hidden; }
    main[data-armed="true"] { visibility: visible; }
    h1 { position: relative; z-index: 1; margin: 4px; font-size: 1.2em; text-shadow: 0 2px 3px #000; }
    #wheelSvg { display: block; width: min(90vw, 78vh, 700px); height: auto; margin: auto; overflow: visible; }
    main[data-armed="true"] #wheelSvg { animation: wheel-in var(--ps-tween) ease; }
    @keyframes wheel-in { from { opacity: 0; } to { opacity: 1; } }
    #vignette, #vignette-top { position: fixed; z-index: 0; left: 0; width: 100%; height: 25vh; pointer-events: none; opacity: 0; transition: opacity var(--ps-tween) ease; }
    #vignette { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); }
    #vignette-top { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,0)); }
    main[data-armed="true"] #vignette, main[data-armed="true"] #vignette-top { opacity: 1; }
    #wheelSvg path { pointer-events: none; }
    #wheelSvg .hit-area { pointer-events: fill; cursor: pointer; stroke: #171a17; stroke-width: 18; transition: fill var(--ps-tween) ease; }
    #wheelSvg .edge-line { fill: none; stroke: rgba(216,212,200,.7); stroke-width: 9; stroke-linejoin: miter; }
    .region.hot .edge-line { stroke: var(--selection-outline) !important; }
    #wheelSvg [aria-disabled="true"] .hit-area { pointer-events: none; }
    .target-region .hit-area { fill: var(--nav-fill) !important; fill-opacity: .95 !important; }
    .target-region.gesture .hit-area { fill: var(--gesture-fill) !important; fill-opacity: 1 !important; }
    .target-region.action .hit-area { fill: var(--action-fill) !important; }
    .navigation-art { display: none; pointer-events: none; }
    .sector[data-kind="submenu"] .submenu-art, .sector[data-kind="back"] .back-art { display: initial; }
    .nearby-region .hit-area { fill: var(--nav-fill); fill-opacity: .95; }
    .chevron-knot { display: none; pointer-events: none; }
    .sector[data-kind="submenu"]:not([aria-disabled="true"]) .chevron-knot, .sector[data-kind="back"]:not([aria-disabled="true"]) .chevron-knot { display: initial; }
    .nearby-region.signal .hit-area { fill: var(--gesture-fill) !important; fill-opacity: 1; }
    .broadcast-symbol { display: none; pointer-events: none; }
    .signal .broadcast-symbol { display: initial; opacity: .6; color: #c5c1b5; transition: opacity var(--ps-tween) ease; }
    .signal.hot .broadcast-symbol { opacity: 1; color: #20251f; }
    .signal-flow { stroke: none; pointer-events: none; }
    .utility-arc { display: none; }
    .sector[data-kind="navigation"] .utility-arc, .sector[data-kind="submenu"] .utility-arc, .sector[data-kind="back"] .utility-arc, .sector[data-kind="hotkey"] .utility-arc { display: initial; }
    #wheelSvg.utility-art-off .navigation-art { display: none !important; }
    @media (prefers-reduced-motion: reduce) { :root { --ps-tween: 0ms; } }
    #wheelSvg .region.hot .hit-area { fill: var(--selection-outline) !important; fill-opacity: 1 !important; }
    #wheelSvg .nearby-region.hot .hit-area { fill: var(--cap-lit-fill) !important; }
    .selected-band { display: none; fill: none; stroke: var(--selection-band); stroke-width: 90; pointer-events: none; }
    .region.hot .selected-band { display: initial; }
    .nearby-region.hot .selected-band { stroke: var(--cap-lit-band); }
    .sector { --lit-kind-fill: var(--nav-fill); }
    .sector[data-kind="intent"] { --lit-kind-fill: var(--gesture-fill); }
    .sector[data-kind="action"] { --lit-kind-fill: var(--action-fill); }
    .sector.lit .sectorLabel { color: var(--lit-kind-fill); }
    .sector.lit .actionLabel { fill: var(--lit-kind-fill); }
    .region:focus, #center:focus { outline: none; }
    #center:focus .hit-area { stroke: var(--selection-outline); }
    .sector[aria-disabled="true"] { opacity: .5; }
    #wheelSvg .sector[aria-disabled="true"] .hit-area { stroke: none; }
    #wheelSvg .sector[aria-disabled="true"] .edge-line { display: none; }
    #wheelSvg .sector[aria-disabled="true"] .target-region .hit-area { fill: var(--nav-fill) !important; stroke: rgba(216,212,200,.28); stroke-width: 9; }
    #wheelSvg #center-hit { fill: #292c29 !important; fill-opacity: 1 !important; pointer-events: all; }
    #wheelSvg #center path { pointer-events: visiblePainted; cursor: pointer; }
    #center:hover #center-hit, #center:focus #center-hit { fill: #53452e !important; }
    #wheelSvg foreignObject, .actionLabel { pointer-events: none; }
    .sectorLabel, .hubContent { width: 100%; height: 100%; display: grid; align-content: center; overflow-wrap: anywhere; text-align: center; }
    .sectorLabel { font: 600 80px/1.12 Georgia, serif; color: #fff3d9; }
    .actionLabel { fill: #f0ce89; font: 700 58px Georgia, serif; text-anchor: middle; dominant-baseline: middle; }
    .hubContent { font: 100px/1.15 Georgia, serif; }
    #caption, #destination { margin: 12px 0; }
    #destination { color: #f0ce89; font-size: .78em; }
    .hubHint { margin-top: 24px; font-size: 64px; color: #c5c1b5; }
    #help { position: relative; z-index: 1; margin: 12px auto 4px; max-width: 800px; font-size: 1.12em; line-height: 1.4; text-shadow: 0 1px 3px #000; }
    #help > span { white-space: nowrap; }
    @media (max-height: 650px) { :root { font-size: 15px; } h1 { margin: 0; } #help { margin: 0; } }
</style>
