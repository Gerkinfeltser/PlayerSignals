<title>PlayerSignals</title>
<style>
    :root { color-scheme: dark; font: 18px Georgia, serif; color: #fff3d9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: transparent; }
    main { width: min(96vw, 800px); text-align: center; visibility: hidden; }
    main[data-armed="true"] { visibility: visible; }
    h1 { margin: 4px; font-size: 1.2em; text-shadow: 0 2px 3px #000; }
    #wheelSvg { display: block; width: min(90vw, 78vh, 700px); height: auto; margin: auto; overflow: visible; }
    #wheelSvg path { pointer-events: none; }
    #wheelSvg .hit-area { pointer-events: all; cursor: pointer; }
    #wheelSvg [aria-disabled="true"] .hit-area { pointer-events: none; }
    .target-region .hit-area { fill: #464740 !important; fill-opacity: .95 !important; }
    .target-region.hot .hit-area { fill: #72562c !important; }
    .nearby-region.hot .hit-area { fill: #e9bd6c !important; }
    .region:focus, #center:focus { outline: none; }
    .region.hot .hit-area, #center:focus .hit-area { stroke: #ffdc8c; stroke-width: 12; }
    .sector[aria-disabled="true"] { opacity: .25; }
    #center-hit { fill: #292c29 !important; }
    #center:hover #center-hit, #center:focus #center-hit { fill: #53452e !important; }
    #wheelSvg foreignObject, .nearbyLabel { pointer-events: none; }
    .sectorLabel, .hubContent { width: 100%; height: 100%; display: grid; align-content: center; overflow-wrap: anywhere; text-align: center; }
    .sectorLabel { font: 600 110px/1.12 Georgia, serif; color: #fff3d9; }
    .nearbyLabel { fill: #28291f; font: 700 72px Georgia, serif; text-anchor: middle; dominant-baseline: middle; }
    .hubContent { font: 100px/1.15 Georgia, serif; }
    #caption, #destination { margin: 12px 0; }
    #destination { color: #f0ce89; font-size: .78em; }
    .hubHint { margin-top: 24px; font-size: 64px; color: #c5c1b5; }
    #help { margin: 4px auto; max-width: 740px; font-size: .78em; line-height: 1.4; text-shadow: 0 1px 3px #000; }
    @media (max-height: 650px) { :root { font-size: 15px; } h1 { margin: 0; } #help { margin: 0; } }
</style>

            }
        });
        cancel.setAttribute("tabindex", "0");
        const first = entries.findIndex(Boolean);
        if (first >= 0) focusRegion(first, "target");
        else if (document.activeElement === cancel) showCancel(); else cancel.focus();
    };
    document.addEventListener("keydown", event => {
        if (event.key === "Escape" || event.key === "Tab") { event.preventDefault(); choose(-1); }
        else if (armed && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
            event.preventDefault();
            if (event.key === "ArrowLeft" || event.key === "ArrowRight") focusRegion(firstAvailable(focused, event.key === "ArrowLeft" ? -1 : 1), focusedMode);
            else focusRegion(focused < 0 ? entries.findIndex(Boolean) : focused, event.key === "ArrowDown" ? "nearby" : "target");
        } else if (armed && (event.key === "Enter" || event.key === " ")) {
            if (document.activeElement === cancel) { event.preventDefault(); choose(-1); }
            else if (focused >= 0 && document.activeElement === sectors[focused][focusedMode]) { event.preventDefault(); choose(focused, focusedMode); }
        }
    });
    failClosed();
    if (window.magelight) window.magelight.on("__uimode", state => { if (state === "0" || state === "1") failClosed(); });
})();
